# ==============================================================================
# Azerbaijani Banknote Recognition & Assistive Smart Glasses System
# Track 3: Industry Product · Final Deep Learning Project
# Production Multi-Service Container Orchestration
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Vision Inference Bridge (Mobile App & Smart Glasses Backend)
  # ----------------------------------------------------------------------------
  vision-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aze_banknote_vision_bridge
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MODEL_ID=yolo11m
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      # Mount experiments and models so new weights do not require image rebuilds
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    command: ["python", "scripts/mobile_bridge.py", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Optional NVIDIA GPU acceleration (for Linux hosts with nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  default:
    name: aze_banknote_net
