[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
markers =
    unit: Isolated component and algorithmic tests.
    integration: Multi-component workflow execution tests.
    invariant: Non-negotiable mathematical and dataset contract assertions.
    slow: Computationally intensive tests.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
